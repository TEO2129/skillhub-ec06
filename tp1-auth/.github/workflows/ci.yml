name: CI - Build, Test and SonarCloud

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set test Master Key
        run: echo "APP_MASTER_KEY=test_master_key_ci_12345678901234567890" >> $GITHUB_ENV

      - name: Build and run tests
        run: |
          cd server
          mvn clean verify

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd server
          mvn sonar:sonar \
            -Dsonar.projectKey=tp-auth-server \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Build Docker image
        run: |
          cd server
          docker build -t auth-server:${{ github.sha }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
          docker tag auth-server:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/auth-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-server:latest
