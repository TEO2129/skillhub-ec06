version: '3.8'

services:
  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: auth-server
    ports:
      - "8080:8080"
    environment:
      - APP_MASTER_KEY=${APP_MASTER_KEY:-test_master_key_123456789012345678901234}
      - JWT_SECRET=${JWT_SECRET:-SkillHubMasterKey2026!SecretJWTKey256BitsMinimum}
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:authdb
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
    networks:
      - auth-network
    restart: unless-stopped

networks:
  auth-network:
    driver: bridge
