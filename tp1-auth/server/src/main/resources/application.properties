# ============================================================
# TP4 - Configuration de l'application
# ============================================================

# ============================================================
# SERVEUR
# ============================================================
server.port=8080

# ============================================================
# BASE DE DONNEES H2 (en memoire)
# ============================================================
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

# ============================================================
# LOGGING
# ============================================================
logging.file.name=logs/auth-server.log
logging.level.com.example.auth=DEBUG
logging.level.org.springframework.security=WARN

# ============================================================
# TP3 : JWT (15 minutes par defaut)
# ============================================================
jwt.secret=${JWT_SECRET:SkillHubMasterKey2026!SecretJWTKey256BitsMinimum}
jwt.expiration=${JWT_EXPIRATION:900000}

# ============================================================
# TP4 : Master Key (obligatoire - pas de valeur par defaut)
# ============================================================
app.master-key=${APP_MASTER_KEY:}
