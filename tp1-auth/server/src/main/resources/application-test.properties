# ============================================================
# TP4 - Configuration pour les tests
# ============================================================

# Master Key pour les tests (32 caractères exactement)
app.master-key=MaCleDeTest32CaracteresExactOK!!

# Base H2 en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging (moins de bruit pour les tests)
logging.level.com.example.auth=WARN
